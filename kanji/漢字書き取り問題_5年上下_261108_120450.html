function hintOf(it){
 var mode=hintMode();
 return (mode==='all'||(mode==='homo'&&HOMO[it[4]]))?(it[5]||''):'';
}
// 1行に収まらないヒントだけ、8ptを下限に文字を少し小さくする（通常は9ptのまま）
function fitHints(){
 var hs=document.querySelectorAll('.hint');
 for(var i=0;i<hs.length;i++){
   var h=hs[i], fs=9;
   while(h.scrollWidth>h.clientWidth+1&&fs>8){fs-=0.25;h.style.fontSize=fs+'pt';}
 }
}
var last=null;

function render(data){
 var paper=document.getElementById('paper');
 paper.innerHTML='';
 var total=data.chunks.length;
 data.chunks.forEach(function(chunk,si){
   var tag = total>1 ? '（'+(si+1)+'枚目／全'+total+'枚）' : '';
   // --- 表：問題ページ ---
   var q='';
   chunk.forEach(function(it,idx){
     var h=hintOf(it);
     q+='<div class="q'+(h?' hq':'')+'">'+(h?'<span class="hint">'+h+'</span>':'')+'<span class="num">'+(idx+1)+'</span><span class="read">'+it[4]+'</span><span class="write"></span></div>';
   });
   paper.insertAdjacentHTML('beforeend',
    '<div class="sheet">'+
      '<div class="hbar">'+
        '<span class="htitle">漢字書き取り（5年 '+data.label+'）'+tag+'</span>'+
        '<span class="hmeta">名前 ____________　点 ____／'+chunk.length+'</span>'+
      '</div>'+
      '<div class="grid">'+q+'</div>'+
    '</div>');
   // --- 裏：解答ページ（同じ枚の直後に配置＝両面で裏面になる）---
   var a='';
   chunk.forEach(function(it,idx){
     a+='<div class="a"><span class="num">'+(idx+1)+'</span><span class="ans">'+it[3]+'</span><span class="rd">（'+it[4]+'）</span></div>';
   });
   paper.insertAdjacentHTML('beforeend',
    '<div class="sheet ans-page"><h2>解答 '+(total>1?'（'+(si+1)+'枚目）':'')+'</h2><div class="akey">'+a+'</div></div>');
 });
 fitHints();
}

function setAnswers(on){
 var nodes=document.querySelectorAll('.ans-page');
 for(var i=0;i<nodes.length;i++){ nodes[i].classList.toggle('show',on); }
 document.getElementById('ansBtn').textContent= on?'🙈 解答をかくす':'👁 解答を表示';
}
function regenerate(){ last=build(); render(last); setAnswers(false); }
// ヒント表示の切り替えでは問題を作り直さず、同じ問題のまま表示だけ更新する（解答の表示状態も保つ）
function rerender(){
 var first=document.querySelector('.ans-page');
 var on=!!(first&&first.classList.contains('show'));
 if(last){ render(last); setAnswers(on); }
}
// 「すべて表示」にした時、1枚が40問を超えていれば作り直す（収まらないため）。それ以外は同じ問題のまま表示だけ更新
function onHintChange(){
 var big=last&&last.chunks.some(function(c){return c.length>HINT_MAX;});
 if(hintMode()==='all'&&big) regenerate(); else rerender();
}
document.getElementById('hintMode').addEventListener('change',onHintChange);
function toggleAnswers(){
 var first=document.querySelector('.ans-page');
 setAnswers(!(first&&first.classList.contains('show')));
}
['fromU','toU','fromD','toD','useU','useD','per','sheets'].forEach(function(id){document.getElementById(id).addEventListener('change',regenerate);});
regenerate();
</script>
</body></html>
