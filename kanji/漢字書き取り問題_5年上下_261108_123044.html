const VOL = ['上','下'];
const HINT_MAX = 40;   // 「すべて表示」は1行ぶん高くなるため1枚40問まで（A4・表裏1枚ずつに収める）
const PLAIN_MAX = 50;  // ヒントなし・同音のみ

function range(v){
 var ns=POOL.filter(function(p){return p[0]===v;}).map(function(p){return p[1];});
 return [Math.min.apply(null,ns),Math.max.apply(null,ns)];
}
const RNG=[range(0),range(1)];

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function val(id,def){var n=parseInt(document.getElementById(id).value);return isNaN(n)?def:n;}
function hintMode(){return document.getElementById('hintMode').value;}

// 巻ごとの範囲指定を読む（上: fromU/toU/useU、下: fromD/toD/useD）
function readRange(v){
 var s=v===0?'U':'D';
 var on=document.getElementById('use'+s).checked;
 var a=val('from'+s,RNG[v][0]), b=val('to'+s,RNG[v][1]);
 if(a>b){var t=a;a=b;b=t;}
 return {on:on,from:a,to:b};
}

function build(){
 var rs=[readRange(0),readRange(1)];
 var per=Math.max(1,val('per',HINT_MAX)), sheets=Math.max(1,val('sheets',1));
 var perMax=hintMode()==='all'?HINT_MAX:PLAIN_MAX, capped=false;
 if(per>perMax){per=perMax;capped=true;document.getElementById('per').value=perMax;}

 var parts=[];
 [0,1].forEach(function(v){if(rs[v].on)parts.push(VOL[v]+' No.'+rs[v].from+'〜'+rs[v].to);});
 var m=document.getElementById('msg');
 if(!parts.length){
   m.textContent='⚠ 「上を出題」「下を出題」のどちらかにチェックを入れてください。'; m.className='msg warn';
   return {chunks:[],label:''};
 }
 var sel=POOL.filter(function(p){var r=rs[p[0]];return r.on&&p[1]>=r.from&&p[1]<=r.to;});
 // 同じ問題を出さない: 問題は「読み」だけが表示されるので、語ではなく読みで重複を除く（同じ漢字を含む別の語はOK。上と下をまたいでも除く）
 // 先にシャッフルしてから除くため、同音の語（例: 賛成／酸性）はどちらが残るかが毎回ランダムになる
 shuffle(sel);
 var seen={}; sel=sel.filter(function(p){var k=p[4];if(seen[k])return false;seen[k]=1;return true;});

 var need=per*sheets, msg='', warn=false, usableSheets=sheets, range_='範囲 '+parts.join('・'), filled=0, poolN=sel.length;
 // 範囲内の問題だけでは足りない時は、範囲より前（既習）の漢字の問題で補う。未習の漢字は混ぜない。
 // 範囲に近い漢字から順に補い、同じ読みの問題は出さない。
 if(sel.length<need && document.getElementById('fillPrev').checked){
   var endOrd=-1; [0,1].forEach(function(v){if(rs[v].on)endOrd=Math.max(endOrd,v*1000+rs[v].to);});
   var cand=POOL.filter(function(p){
     var r=rs[p[0]], o=p[0]*1000+p[1];
     return !(r.on&&p[1]>=r.from&&p[1]<=r.to) && o<endOrd && !seen[p[4]];
   });
   shuffle(cand);
   cand.sort(function(a,b){return (b[0]*1000+b[1])-(a[0]*1000+a[1]);});
   for(var i=0;i<cand.length&&sel.length<need;i++){
     if(seen[cand[i][4]])continue;
     seen[cand[i][4]]=1; sel.push(cand[i]); filled++;
   }
   if(filled) shuffle(sel);
 }
 if(sel.length<need){
   warn=true;
   var full=Math.floor(sel.length/per), rem=sel.length%per;
   usableSheets=full+(rem>0?1:0);
   msg='⚠ '+range_+' の問題は '+sel.length+' 問しかありません（範囲内'+poolN+'問'+(filled?'＋既習から'+filled+'問':'')+'）。重複なしで作れるのは '+per+'問×'+full+'枚'+(rem>0?'＋'+rem+'問の1枚':'')+'（計'+usableSheets+'枚）まで。範囲を広げるか、1枚の問題数を減らしてください。';
 }else{
   msg='✓ '+range_+'（範囲内'+poolN+'問'+(filled?'＋既習から'+filled+'問':'')+'）から '+per+'問 × '+sheets+'枚＝計'+need+'問を同じ問題なしで出題（同じ読みの問題は除外済み）。';
 }
 if(filled) msg+=' ※範囲内の問題だけでは足りないため、範囲より前の既習の漢字から'+filled+'問を補いました。';
 if(capped) msg+=' ※ヒントを「すべて表示」にすると1枚'+HINT_MAX+'問までのため、1枚の問題数を'+perMax+'問にしました。';

 var chunks=[];
 for(var s=0;s<usableSheets;s++){
   var c=sel.slice(s*per,(s+1)*per);
   if(c.length) chunks.push(c);
 }
 m.textContent=msg; m.className='msg'+(warn?' warn':'');
 return {chunks:chunks,label:parts.join('／')};
}

// 同音（同じ読みで語が異なる）の読みの一覧（上下をまたいで判定）。ヒント「同音の問題のみ」で使う
var HOMO={};
(function(){var m={};POOL.forEach(function(p){(m[p[4]]=m[p[4]]||{})[p[3]]=1;});
 for(var r in m){if(Object.keys(m[r]).length>1)HOMO[r]=1;}})();
function hintOf(it){
 var mode=hintMode();
 return (mode==='all'||(mode==='homo'&&HOMO[it[4]]))?(it[5]||''):'';
}
// 1行に収まらないヒントだけ、8ptを下限に文字を少し小さくする（通常は9ptのまま）
function fitHints(){
 var hs=document.querySelectorAll('.hint');
 for(var i=0;i<hs.length;i++){
   var h=hs[i], fs=9;
   while(h.scrollWidth>h.clientWidth+1&&fs>8){fs-=0.25;h.style.fontSize=fs+'pt';}
 }
}
var last=null;

function render(data){
 var paper=document.getElementById('paper');
 paper.innerHTML='';
 var total=data.chunks.length;
 data.chunks.forEach(function(chunk,si){
   var tag = total>1 ? '（'+(si+1)+'枚目／全'+total+'枚）' : '';
   // --- 表：問題ページ ---
   var q='';
   chunk.forEach(function(it,idx){
     var h=hintOf(it);
     q+='<div class="q'+(h?' hq':'')+'">'+(h?'<span class="hint">'+h+'</span>':'')+'<span class="num">'+(idx+1)+'</span><span class="read">'+it[4]+'</span><span class="write"></span></div>';
   });
   paper.insertAdjacentHTML('beforeend',
    '<div class="sheet">'+
      '<div class="hbar">'+
        '<span class="htitle">漢字書き取り（5年 '+data.label+'）'+tag+'</span>'+
        '<span class="hmeta">名前 ____________　点 ____／'+chunk.length+'</span>'+
      '</div>'+
      '<div class="grid">'+q+'</div>'+
    '</div>');
   // --- 裏：解答ページ（同じ枚の直後に配置＝両面で裏面になる）---
   var a='';
   chunk.forEach(function(it,idx){
     a+='<div class="a"><span class="num">'+(idx+1)+'</span><span class="ans">'+it[3]+'</span><span class="rd">（'+it[4]+'）</span></div>';
   });
   paper.insertAdjacentHTML('beforeend',
    '<div class="sheet ans-page"><h2>解答 '+(total>1?'（'+(si+1)+'枚目）':'')+'</h2><div class="akey">'+a+'</div></div>');
 });
 fitHints();
}

function setAnswers(on){
 var nodes=document.querySelectorAll('.ans-page');
 for(var i=0;i<nodes.length;i++){ nodes[i].classList.toggle('show',on); }
 document.getElementById('ansBtn').textContent= on?'🙈 解答をかくす':'👁 解答を表示';
}
function regenerate(){ last=build(); render(last); setAnswers(false); }
// ヒント表示の切り替えでは問題を作り直さず、同じ問題のまま表示だけ更新する（解答の表示状態も保つ）
function rerender(){
 var first=document.querySelector('.ans-page');
 var on=!!(first&&first.classList.contains('show'));
 if(last){ render(last); setAnswers(on); }
}
// 「すべて表示」にした時、1枚が40問を超えていれば作り直す（収まらないため）。それ以外は同じ問題のまま表示だけ更新
function onHintChange(){
 var big=last&&last.chunks.some(function(c){return c.length>HINT_MAX;});
 if(hintMode()==='all'&&big) regenerate(); else rerender();
}
document.getElementById('hintMode').addEventListener('change',onHintChange);
function toggleAnswers(){
 var first=document.querySelector('.ans-page');
 setAnswers(!(first&&first.classList.contains('show')));
}
['fromU','toU','fromD','toD','useU','useD','per','sheets','fillPrev'].forEach(function(id){document.getElementById(id).addEventListener('change',regenerate);});
regenerate();
</script>
