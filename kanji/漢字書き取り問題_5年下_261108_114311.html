 *{box-sizing:border-box;}

 .hmeta{margin-left:auto;font-size:9.5pt;color:#333;white-space:nowrap;}
 .grid{display:grid;grid-template-columns:1fr 1fr;column-gap:8mm;}
 .q{display:flex;align-items:flex-end;gap:2mm;min-height:9.6mm;border-bottom:1px solid #888;padding-bottom:.6mm;}
 .num{flex:0 0 6mm;font-weight:bold;font-size:9.5pt;color:#0a5;text-align:right;}
 .read{flex:0 0 auto;font-size:9.5pt;color:#222;padding-bottom:.3mm;}
 /* 意味ヒント: 読みの上に1行で小さく表示（答えの語の漢字は使っていない説明文） */
 .q.hq{flex-wrap:wrap;align-content:flex-end;min-height:13.5mm;}
 .hint{flex:0 0 100%;font-size:7.5pt;color:#555;line-height:1.3;padding-left:8mm;white-space:nowrap;overflow:hidden;}
 .write{flex:1 1 auto;}

 .akey{display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:6mm;row-gap:1mm;}
 .a{display:flex;align-items:baseline;font-size:10.5pt;padding:.8mm 0;border-bottom:1px dotted #ccc;}
 .a .num{flex:0 0 8mm;}
 .a .ans{font-weight:bold;font-size:12pt;margin-right:2mm;}
 .a .rd{font-size:8.5pt;color:#777;}
 .ans-page{display:none;}
 .ans-page.show{display:block;}
 @media print{
   body{background:#fff;}
   .panel{display:none;}
   .sheet{box-shadow:none;margin:0;max-width:none;padding:0;}

   @page{size:A4;margin:10mm;}

</style></head>

 var sheets=Math.max(1,parseInt(document.getElementById('sheets').value)||1);

 var sel=POOL.filter(function(p){return p[0]>=from&&p[0]<=to;});
 // 同じ問題を出さない: 問題は「読み」だけが表示されるので、語ではなく読みで重複を除く（同じ漢字を含む別の語はOK）
 // 先にシャッフルしてから除くため、同音の語（例: 賛成／酸性）はどちらが残るかが毎回ランダムになる
 shuffle(sel);
 var seen={}; sel=sel.filter(function(p){var k=p[3];if(seen[k])return false;seen[k]=1;return true;});

 var need=per*sheets, msg='', warn=false, usableSheets=sheets;
 if(sel.length<need){
   warn=true;
   var full=Math.floor(sel.length/per), rem=sel.length%per;
   usableSheets=full+(rem>0?1:0);
   msg='⚠ 選択範囲 No.'+from+'〜'+to+' の問題は '+sel.length+' 問しかありません。重複なしで作れるのは '+per+'問×'+full+'枚'+(rem>0?'＋'+rem+'問の1枚':'')+'（計'+usableSheets+'枚）まで。範囲を広げるか、1枚の問題数を減らしてください。';
 }else{
   msg='✓ No.'+from+'〜'+to+'（'+sel.length+'問のプール）から '+per+'問 × '+sheets+'枚＝計'+need+'問を同じ問題なしで出題（同じ読みの問題は除外済み）。';
 }

 var chunks=[];
 for(var s=0;s<usableSheets;s++){
   var c=sel.slice(s*per,(s+1)*per);
   if(c.length) chunks.push(c);
 }
 if(capped) msg+=' ※ヒントを「すべて表示」にすると1枚'+HINT_MAX+'問までのため、1枚の問題数を'+HINT_MAX+'問にしました。';
 var m=document.getElementById('msg');
 m.textContent=msg; m.className='msg'+(warn?' warn':'');
 return {chunks:chunks,from:from,to:to};
}

// 同音（同じ読みで語が異なる）の読みの一覧。ヒント「同音の問題のみ」で使う
var HOMO={};
(function(){var m={};POOL.forEach(function(p){(m[p[3]]=m[p[3]]||{})[p[2]]=1;});
 for(var r in m){if(Object.keys(m[r]).length>1)HOMO[r]=1;}})();
// 読みの上に出す意味ヒント（POOLの5番目。答えの語の漢字を使わずに書いた説明）
var HINT_MAX=36; // 「すべて表示」は1行ぶん高くなるため、1枚36問まで（A4・表裏1枚ずつに収める）
function hintOf(it){
 var mode=document.getElementById('hintMode').value;
 return (mode==='all'||(mode==='homo'&&HOMO[it[3]]))?(it[4]||''):'';
}
var last=null;

function render(data){
 var paper=document.getElementById('paper');
 paper.innerHTML='';
 var total=data.chunks.length;
 data.chunks.forEach(function(chunk,si){
   var tag = total>1 ? '（'+(si+1)+'枚目／全'+total+'枚）' : '';
   // --- 表：問題ページ ---
   var q='';
   chunk.forEach(function(it,idx){
     var h=hintOf(it);
     q+='<div class="q'+(h?' hq':'')+'">'+(h?'<span class="hint">'+h+'</span>':'')+'<span class="num">'+(idx+1)+'</span><span class="read">'+it[3]+'</span><span class="write"></span></div>';
   });
   paper.insertAdjacentHTML('beforeend',
    '<div class="sheet">'+
      '<div class="hbar">'+
        '<span class="htitle">漢字書き取り（5年下 No.'+data.from+'〜'+data.to+'）'+tag+'</span>'+
        '<span class="hmeta">名前 ____________　点 ____／'+chunk.length+'</span>'+
      '</div>'+
      '<div class="grid">'+q+'</div>'+
    '</div>');
   // --- 裏：解答ページ（同じ枚の直後に配置＝両面で裏面になる）---
   var a='';
   chunk.forEach(function(it,idx){
     a+='<div class="a"><span class="num">'+(idx+1)+'</span><span class="ans">'+it[2]+'</span><span class="rd">（'+it[3]+'）</span></div>';
   });
   paper.insertAdjacentHTML('beforeend',
    '<div class="sheet ans-page"><h2>解答 '+(total>1?'（'+(si+1)+'枚目）':'')+'</h2><div class="akey">'+a+'</div></div>');
 });
}

function setAnswers(on){
 var nodes=document.querySelectorAll('.ans-page');
 for(var i=0;i<nodes.length;i++){ nodes[i].classList.toggle('show',on); }
 document.getElementById('ansBtn').textContent= on?'🙈 解答をかくす':'👁 解答を表示';
}
function regenerate(){ last=build(); render(last); setAnswers(false); }
// ヒント表示の切り替えでは問題を作り直さず、同じ問題のまま表示だけ更新する（解答の表示状態も保つ）
function rerender(){
 var first=document.querySelector('.ans-page');
 var on=!!(first&&first.classList.contains('show'));
 if(last){ render(last); setAnswers(on); }
}
// 「すべて表示」にした時、1枚が36問を超えていれば作り直す（収まらないため）。それ以外は同じ問題のまま表示だけ更新
function onHintChange(){
 var big=last&&last.chunks.some(function(c){return c.length>HINT_MAX;});
 if(document.getElementById('hintMode').value==='all'&&big) regenerate(); else rerender();
}
document.getElementById('hintMode').addEventListener('change',onHintChange);
function toggleAnswers(){
 var first=document.querySelector('.ans-page');
 setAnswers(!(first&&first.classList.contains('show')));
}
['from','to','per','sheets'].forEach(function(id){document.getElementById(id).addEventListener('change',regenerate);});
regenerate();
</script>
</body></html>
