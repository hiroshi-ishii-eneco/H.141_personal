<title>漢字書き取り問題 5年下</title>
<style>
 *{box-sizing:border-box;}
 body{font-family:"Yu Gothic","Meiryo","MS PGothic",sans-serif;color:#1a1a1a;margin:0;background:#eef1f4;}
 .panel{position:sticky;top:0;z-index:20;background:#0a5;color:#fff;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.2);}
 .panel .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:center;}
 .fld{display:flex;flex-direction:column;gap:3px;font-size:12px;}
 .fld label{font-weight:bold;opacity:.95;}
 .fld input{width:78px;font-size:15px;padding:6px 8px;border:none;border-radius:6px;text-align:center;}
 .panel button{font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer;border:none;border-radius:8px;
   padding:9px 16px;background:#fff;color:#0a5;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .08s;}
 .panel button:hover{transform:translateY(-1px);}
 .panel button:active{transform:translateY(1px);box-shadow:none;}
 .panel button.sec{background:#0c6f4a;color:#fff;border:1px solid #fff6;}
 .msg{max-width:980px;margin:8px auto 0;font-size:12.5px;text-align:center;min-height:1em;}
 .msg.warn{color:#ffe08a;font-weight:bold;}
 .sheet{background:#fff;max-width:190mm;margin:6mm auto;padding:10mm;box-shadow:0 2px 12px rgba(0,0,0,.12);}
 .hbar{display:flex;align-items:baseline;gap:4mm;border-bottom:1.5px solid #0a5;padding-bottom:1.2mm;margin-bottom:2.5mm;}
 .htitle{font-size:11.5pt;font-weight:bold;}
 .hmeta{margin-left:auto;font-size:9.5pt;color:#333;white-space:nowrap;}
 .grid{display:grid;grid-template-columns:1fr 1fr;column-gap:8mm;}
 .q{display:flex;align-items:flex-end;gap:2mm;min-height:9.6mm;border-bottom:1px solid #888;padding-bottom:.6mm;}
 .num{flex:0 0 6mm;font-weight:bold;font-size:9.5pt;color:#0a5;text-align:right;}
 .read{flex:0 0 auto;font-size:9.5pt;color:#222;padding-bottom:.3mm;}
 .write{flex:1 1 auto;}
 h2{font-size:13pt;border-left:5px solid #0a5;padding-left:3mm;margin:0 0 3mm;}
 .akey{display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:6mm;row-gap:1mm;}
 .a{display:flex;align-items:baseline;font-size:10.5pt;padding:.8mm 0;border-bottom:1px dotted #ccc;}
 .a .num{flex:0 0 8mm;}
 .a .ans{font-weight:bold;font-size:12pt;margin-right:2mm;}
 .a .rd{font-size:8.5pt;color:#777;}
 .ans-page{display:none;}
 .ans-page.show{display:block;}
 @media print{
   body{background:#fff;}
   .panel{display:none;}
   .sheet{box-shadow:none;margin:0;max-width:none;padding:0;}
   /* 各ページを1枚に割り当て、両面印刷で 表=問題／裏=解答 になるよう改ページ */
   .sheet{page-break-after:always;}
   .sheet:last-child{page-break-after:auto;}
   .ans-page{display:block !important;}
   @page{size:A4;margin:10mm;}
 }
</style></head>

const NOS = POOL.map(p=>p[0]);
const NO_MIN = Math.min.apply(null,NOS), NO_MAX = Math.max.apply(null,NOS);

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function build(){
 var from=parseInt(document.getElementById('from').value)||NO_MIN;
 var to=parseInt(document.getElementById('to').value)||NO_MAX;
 if(from>to){var x=from;from=to;to=x;}
 var per=Math.max(1,parseInt(document.getElementById('per').value)||50);
 var sheets=Math.max(1,parseInt(document.getElementById('sheets').value)||1);

 var sel=POOL.filter(function(p){return p[0]>=from&&p[0]<=to;});
 // 同じ問題を出さない: 問題は「読み」だけが表示されるので、語ではなく読みで重複を除く（同じ漢字を含む別の語はOK）
 // 先にシャッフルしてから除くため、同音の語（例: 賛成／酸性）はどちらが残るかが毎回ランダムになる
 shuffle(sel);
 var seen={}; sel=sel.filter(function(p){var k=p[3];if(seen[k])return false;seen[k]=1;return true;});

 var need=per*sheets, msg='', warn=false, usableSheets=sheets;
 if(sel.length<need){
   warn=true;
   var full=Math.floor(sel.length/per), rem=sel.length%per;
   usableSheets=full+(rem>0?1:0);
   msg='⚠ 選択範囲 No.'+from+'〜'+to+' の問題は '+sel.length+' 問しかありません。重複なしで作れるのは '+per+'問×'+full+'枚'+(rem>0?'＋'+rem+'問の1枚':'')+'（計'+usableSheets+'枚）まで。範囲を広げるか、1枚の問題数を減らしてください。';
 }else{
   msg='✓ No.'+from+'〜'+to+'（'+sel.length+'問のプール）から '+per+'問 × '+sheets+'枚＝計'+need+'問を同じ問題なしで出題（同じ読みの問題は除外済み）。';
 }

 var chunks=[];
 for(var s=0;s<usableSheets;s++){
   var c=sel.slice(s*per,(s+1)*per);
   if(c.length) chunks.push(c);
 }
 var m=document.getElementById('msg');
 m.textContent=msg; m.className='msg'+(warn?' warn':'');
 return {chunks:chunks,from:from,to:to};
}

function render(data){
 var paper=document.getElementById('paper');
 paper.innerHTML='';
 var total=data.chunks.length;
 data.chunks.forEach(function(chunk,si){
   var tag = total>1 ? '（'+(si+1)+'枚目／全'+total+'枚）' : '';
   // --- 表：問題ページ ---
   var q='';
   chunk.forEach(function(it,idx){
     q+='<div class="q"><span class="num">'+(idx+1)+'</span><span class="read">'+it[3]+'</span><span class="write"></span></div>';
   });
   paper.insertAdjacentHTML('beforeend',
    '<div class="sheet">'+
      '<div class="hbar">'+
        '<span class="htitle">漢字書き取り（5年下 No.'+data.from+'〜'+data.to+'）'+tag+'</span>'+
        '<span class="hmeta">名前 ____________　点 ____／'+chunk.length+'</span>'+
      '</div>'+
      '<div class="grid">'+q+'</div>'+
    '</div>');
   // --- 裏：解答ページ（同じ枚の直後に配置＝両面で裏面になる）---
   var a='';
   chunk.forEach(function(it,idx){
     a+='<div class="a"><span class="num">'+(idx+1)+'</span><span class="ans">'+it[2]+'</span><span class="rd">（'+it[3]+'）</span></div>';
   });
   paper.insertAdjacentHTML('beforeend',
    '<div class="sheet ans-page"><h2>解答 '+(total>1?'（'+(si+1)+'枚目）':'')+'</h2><div class="akey">'+a+'</div></div>');
 });
}

function setAnswers(on){
 var nodes=document.querySelectorAll('.ans-page');
 for(var i=0;i<nodes.length;i++){ nodes[i].classList.toggle('show',on); }
 document.getElementById('ansBtn').textContent= on?'🙈 解答をかくす':'👁 解答を表示';
}
function regenerate(){ render(build()); setAnswers(false); }
function toggleAnswers(){
 var first=document.querySelector('.ans-page');
 setAnswers(!(first&&first.classList.contains('show')));
}
['from','to','per','sheets'].forEach(function(id){document.getElementById(id).addEventListener('change',regenerate);});
regenerate();
